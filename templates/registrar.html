{% extends 'base.html' %}
{% block content %}
    <h1>Registrar</h1>
    <p class="subtitulo">Crie sua conta para cadastrar e acompanhar ONGs na plataforma.</p>

    <form action="/registrar" method="POST" class="form-contato form-login">

        <div class="campo">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" placeholder="Escolha um usuário" required>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Crie uma senha" required>
        </div>

        <div class="campo">
            <label for="confirm_password">Confirmar Senha</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme sua senha" required>
        </div>

        <button type="submit" class="btn-enviar">Registrar</button>
    </form>

    <p class="subtitulo">Já tem conta? <a href="/login">Entrar</a></p>
{% endblock %}
