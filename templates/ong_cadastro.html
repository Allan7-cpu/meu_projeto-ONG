{% extends 'base.html' %}
{% block content %}
    <h1>Cadastro de ONGs</h1>
    <p class="subtitulo">Preencha os dados abaixo para cadastrar sua ONG na plataforma.</p>

    <form action="/cadastrar" method="POST" class="form-contato form-cadastro">

        <div class="campo">
            <label for="nome">Nome da ONG</label>
            <input type="text" id="nome" name="nome" maxlength="100" placeholder="Nome da sua ONG" required>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="250" placeholder="contato@ong.org" required>
            </div>
            <div class="campo">
                <label for="tel">Telefone</label>
                <input type="tel" id="tel" name="tel" placeholder="(00) 00000-0000" required>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" placeholder="00000-000" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
            </div>
        </div>

        <div class="linha linha-endereco">
            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, avenida..." required>
            </div>
            <div class="campo">
                <label for="numero">Nº</label>
                <input type="number" id="numero" name="numero" placeholder="123" required>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
            </div>
            <div class="campo">
                <label for="pix">Chave PIX</label>
                <input type="text" id="pix" name="pix" placeholder="Sua chave PIX" required>
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição da ONG</label>
            <textarea id="descricao" name="descricao" maxlength="250" rows="5" placeholder="Conte um pouco sobre o trabalho da sua ONG..."></textarea>
        </div>

        <button type="submit" class="btn-enviar">Cadastrar</button>
    </form>
{% endblock %}
