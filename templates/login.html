{% extends 'base.html' %}
{% block content %}
    <h1>Login</h1>
    <p class="subtitulo">Entre com seu usuário e senha para acessar a plataforma.</p>

    <form action="/login" method="POST" class="form-contato">

        <div class="campo">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" placeholder="Seu usuário" required>
        </div>

        <div class="campo">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Sua senha" required>
        </div>

        <button type="submit" class="btn-enviar">Entrar</button>
    </form>

    <p class="subtitulo">Ainda não tem conta? <a href="/registrar">Registrar</a></p>
{% endblock %}
