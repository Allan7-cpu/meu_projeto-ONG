{% extends 'base.html' %}
{% block content %}
    <h1>Alteração de ONGs</h1>
    <p class="subtitulo">Preencha os dados abaixo para cadastrar sua ONG na plataforma.</p>

    <form action="/alterar" method="POST" class="form-contato form-cadastro">

        <label for="id">Id:</label>
        <input type="number" value="{{ ong.id }}" disabled>
        <input type="hidden" id="id" name="id" value="{{ ong.id }}">

        <div class="campo">
            <label for="nome">Nome da ONG</label>
            <input type="text" id="nome" name="nome" maxlength="100" value="{{ ong.nome }}" placeholder="Nome da sua ONG" required>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="250" value="{{ ong.email }}" placeholder="contato@ong.org" required>
            </div>
            <div class="campo">
                <label for="tel">Telefone</label>
                <input type="tel" id="tel" name="tel" placeholder="(00) 00000-0000" value="{{ ong.tel }}" required>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" placeholder="00000-000" value="{{ ong.cep }}" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" value="{{ ong.cidade}}" required>
            </div>
        </div>

        <div class="linha linha-endereco">
            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, avenida..." value="{{ ong.endereco }}" required>
            </div>
            <div class="campo">
                <label for="numero">Nº</label>
                <input type="number" id="numero" name="numero" placeholder="123" value="{{ ong.numero }}" required>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" value="{{ ong.cnpj }}" required>
            </div>
            <div class="campo">
                <label for="pix">Chave PIX</label>
                <input type="text" id="pix" name="pix" placeholder="Sua chave PIX" value="{{ ong.pix }}" required>
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição da ONG</label>
            <textarea id="descricao" name="descricao" maxlength="250" rows="5" placeholder="Conte um pouco sobre o trabalho da sua ONG...">{{ ong.descricao }}</textarea>
        </div>

        <button type="submit" class="btn-enviar">Alterar</button>
    </form>
{% endblock %}
